[build-system]
requires = ["setuptools>=77,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rap_wam"
version = "0.2.3"
description = "RAP-WAM: Learning World-Action Models through Predictive Rehearsal and Action Perturbations"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/licenses/*.txt", "third_party/wan_official/LICENSE.txt"]
authors = [{name = "RAP-WAM contributors"}]
keywords = ["robot-learning", "world-action-model", "flow-matching", "robodojo"]
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0",
  "accelerate==1.2.0", "diffusers==0.35.2", "transformers==4.30.0",
  "hydra-core==1.3.2", "omegaconf==2.3.0", "dill==0.3.9",
  "sentencepiece>=0.2,<0.3", "protobuf>=3.20,<7",
  "numpy==1.26.0", "zarr==2.12.0", "numcodecs==0.12.1",
  "einops==0.8.1", "timm==1.0.12", "ftfy>=6.1,<7", "regex>=2024.0",
  "opencv-python==4.11.0.86", "tqdm>=4.66,<5"
]

[project.urls]
Homepage = "https://rapwam.github.io/"
Paper = "https://arxiv.org/abs/2610.16443"

[project.optional-dependencies]
data = ["pandas==2.3.3", "pyarrow==21.0.0"]
tracking = ["wandb>=0.18,<0.20"]

[project.scripts]
rap_wam_train = "rap_wam.train:main"
rap_wam_prepare = "rap_wam.prepare_data:main"
rap_wam_preflight = "rap_wam.preflight:main"
rap_wam_task_context = "rap_wam.task_context:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rap_wam*", "third_party*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
rap_wam = ["configs/*.yaml", "task_strings.json"]
"third_party.wan_official" = ["LICENSE.txt"]

