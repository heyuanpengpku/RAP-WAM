name: RAP-WAM CPU Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
      WANDB_MODE: disabled
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies and video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[data]'
          python -m pip check
      - name: Check documentation and release integrity
        run: |
          python scripts/check_docs.py
          python -m rap_wam.check_release
      - name: Resolve both training profiles
        run: |
          python -m rap_wam.train --config-name robodojo --cfg job --resolve
          python -m rap_wam.train --config-name real_robot --cfg job --resolve
      - name: Run synthetic-data and reduced-policy contracts
        run: python -m unittest discover -s tests -v
