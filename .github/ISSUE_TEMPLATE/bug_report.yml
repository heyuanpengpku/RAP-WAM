name: Bug Report
description: Report a reproducible setup, data or training failure.
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Describe the failing stage and the exact error.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Release, profile, Python, torch, CUDA/driver, device and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Sanitized command/overrides, minimal input dimensions/counts and original traceback. Omit credentials and private infrastructure details.
      render: text
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already run
      description: Preflight, dry-run, tests, and whether the failure needs the real model or an auxiliary branch.
